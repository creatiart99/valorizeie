name: Vendor WordPress assets

on:
  push:
    branches: [migration-autofix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror WordPress pages and assets
        run: python3 scripts/vendor_wordpress.py

      - name: Commit generated static mirror and fast-forward main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html our-services sobre-nosotros nuestro-equipo contacts assets MIGRATION_REPORT.md scripts/vendor_wordpress.py .github/workflows/vendor-wordpress.yml
          if ! git diff --cached --quiet; then
            git commit -m "Vendor WordPress assets into static site"
          fi
          git push origin HEAD:main
