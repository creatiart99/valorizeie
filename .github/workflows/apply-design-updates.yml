name: Apply design updates

on:
  push:
    branches: [design-updates-v2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main
        run: git push origin HEAD:main
