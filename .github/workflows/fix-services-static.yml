name: Fix services and static runtime

on:
  push:
    branches: [fix-services-static]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate service detail pages and fix counters
        run: python3 scripts/migrate_services.py
      - name: Commit fixes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html our-services sobre-nosotros nuestro-equipo contacts services assets scripts/migrate_services.py
          git commit -m "Add service pages and fix static counters" || true
          git push origin HEAD:main
