name: Detach WordPress runtime

on:
  push:
    branches: [detach-wordpress]

permissions:
  contents: write

jobs:
  detach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/detach_wordpress.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html our-services sobre-nosotros nuestro-equipo contacts assets/valorize-overrides.js
          git commit -m "Detach site from WordPress runtime"
          git push origin HEAD:main
